name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Check Python dependencies
        run: python -m pip check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Validate JSON files
        run: >-
          python -c "import json; from pathlib import Path; paths = sorted(Path('schemas').rglob('*.json')); [json.loads(path.read_text(encoding='utf-8')) for path in paths]; print(f'Validated {len(paths)} JSON files')"

      - name: Check Git whitespace
        run: git diff --check HEAD^ HEAD

  node-validation:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install Node dependencies
        run: npm ci

      - name: Check ConPTY host syntax
        run: node --check scripts/pty-host.js

      - name: Audit Node dependencies
        run: npm audit --omit=dev

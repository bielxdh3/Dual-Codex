# Copy to config.toml and adjust paths. Account names are local stable keys;
# labels are display-only and are never used to identify a login.

[orchestrator]
repository = "C:/Projects/Dual-Codex"
runs_dir = "runs"
max_correction_cycles = 1
require_clean_git = true
codex_command = "codex"
node_command = "node"
terminal_readiness_timeout = 60
terminal_turn_start_timeout = 15
# Native TUI live attach retains bounded output and reports behind cursors.
# `delegate --reuse-existing` is strict and never starts or changes a TUI.
app_server_initialize_timeout = 30
app_server_thread_timeout = 30
app_server_turn_start_timeout = 30
app_server_turn_timeout = 600
dashboard_telemetry_timeout = 5
live_event_journal_max_records = 2000
live_event_journal_max_record_bytes = 65536
live_event_journal_max_detail_bytes = 16384

[accounts.primary]
label = "Primary account"
codex_home = "C:/Users/USER/CodexProfiles/architect"
model = ""
reasoning_effort = "high"
service_tier = ""
backend = "windows"

[accounts.secondary]
label = "Secondary account"
codex_home = "C:/Users/USER/CodexProfiles/executor"
model = ""
reasoning_effort = "high"
service_tier = ""
backend = "app_server"

[roles]
orchestrator = "primary"
architect = "primary"
reviewer = "primary"
executor = "secondary"
